# ============================================================
# Mosquitto MQTT Broker Configuration
# ============================================================

# Network listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Allow anonymous connections (hackathon only — not for production)
allow_anonymous true

# Logging
log_type all
log_dest stdout

# Persistence
persistence true
persistence_location /mosquitto/data/

# Message queue
max_queued_messages 1000
message_size_limit 0
