# ============================================================
# Default Configuration — Supply Chain Digital Twin
# ============================================================

# Application
app:
  name: "AI-Powered Supply Chain Digital Twin"
  version: "1.0.0"
  environment: "development"
  debug: true

# Database
database:
  url: "sqlite:///./supply_chain.db"       # Override with DATABASE_URL env
  echo: false                               # Set true for SQL query logging
  pool_size: 5
  max_overflow: 10

# MQTT
mqtt:
  broker: "localhost"
  port: 1883
  keepalive: 60
  topic_prefix: "sensors/warehouse"
  qos: 1

# ML Model
ml:
  model_directory: "./models"
  lookback_days: 365
  forecast_horizon: 30
  quantiles: [0.1, 0.5, 0.9]
  train_test_split: 0.8
  lightgbm:
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    num_boost_round: 1000
    early_stopping_rounds: 50
    seed: 42

# Inventory Optimization
inventory:
  service_levels:
    90: 1.28
    95: 1.65
    99: 2.33
  default_service_level: 0.95
  holding_cost_rate: 0.25          # 25% of item cost per year
  ordering_cost: 50.0              # Fixed cost per PO
  shortage_cost_multiplier: 2.0   # Cost multiplier for stockouts

# Risk Classification Thresholds
risk:
  critical: 0.30    # P(stockout) > 30%
  high: 0.15        # P(stockout) > 15%
  medium: 0.05      # P(stockout) > 5%
  low: 0.0          # P(stockout) <= 5%

# Overstock Rules
overstock:
  doi_threshold: 90              # Days of inventory threshold
  inventory_excess_multiplier: 2 # Inventory > 2x expected demand
  low_demand_threshold: 5        # Daily demand considered "low"

# Simulation
simulation:
  default_num_runs: 100
  max_num_runs: 1000
  default_horizon_days: 90
  default_lead_time_mean: 3.0
  default_lead_time_std: 0.5
  default_supplier_reliability: 0.95
  default_demand_multiplier: 1.0

# IoT / Alerts
iot:
  alert_threshold_pct: 10.0     # Alert if IoT vs ERP diff > 10%
  critical_threshold_pct: 25.0  # Critical if diff > 25%
  update_interval_seconds: 30

# API
api:
  port: 8000
  host: "0.0.0.0"
  workers: 1
  log_level: "info"
  cors_origins:
    - "http://localhost:8501"
    - "http://localhost:3000"

# Dashboard
dashboard:
  backend_url: "http://localhost:8000"
  refresh_interval: 30           # seconds
  max_table_rows: 500
  chart_height: 400

# Sample Data Generation
sample_data:
  num_skus: 50
  num_suppliers: 5
  num_warehouses: 2
  num_sensors: 20
  history_days: 730              # 2 years
  seed: 42
